[package]
name = "vesting_idl"
description = "SPEL IDL of the vesting and vesting_fees programs: generated from vesting_core, checked against it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vesting_core.workspace = true
# SPEL's IDL v2 types, generator (`idl-gen`) and IDL-driven Borsh decoder (`decode`), at the commit of its
# `refactor/lez-v0.4.x` branch (LEZ v0.4.0-rc3) that logos-blockchain/lez-programs pins for its own IDLs.
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "d7444f84cabee3371aca3bdee8ebc4c2fc45ebde", features = ["idl-gen", "decode"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
borsh.workspace = true
# The config state of the fee switch, encoded by the program's own type.
vesting_fees.workspace = true
lee_core.workspace = true
lez-admin-authority.workspace = true
