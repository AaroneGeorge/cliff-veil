[package]
name = "token_guest"
description = "The LEZ token program of lez-programs at the pinned commit, built from source for the executor tests and local deployments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "token"
path = "src/bin/token.rs"

[dependencies]
lee_core.workspace = true
risc0-zkvm.workspace = true
# Same source as lez-programs' own guest (programs/token/methods/guest), branch refactor/lez-v0.4.x.
token_program = { git = "https://github.com/logos-blockchain/lez-programs", rev = "3f04cc37ec5f90358e606b0fe7d28baa6b1dbd7e" }

[package.metadata.cargo-machete]
ignored = ["risc0-zkvm"]
