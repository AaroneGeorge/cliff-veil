# A private claim with a real RISC Zero proof (RISC0_DEV_MODE unset everywhere) on a standalone LEZ v0.4.0-rc3
# sequencer that verifies proofs, run on a GitHub-hosted runner and recorded (tools/real_proof/README.md).
# Started by hand: the proof alone takes most of an hour on 4 cores and about 10 GiB of memory.
# Actions are pinned by commit SHA (tag in the comment).
name: real-proof

on:
  workflow_dispatch:
    inputs:
      swap_gb:
        description: Swap file added before the run, in GiB (0 for none); a margin over the runner's 16 GiB
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: real-proof
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RISC0_DOCKER_CONTAINER_TAG: r0.1.91.1
  # LEZ v0.4.0-rc3; must equal the lez line of scripts/pins.txt (checked below).
  LEZ_COMMIT: bafd07be0701398f9bc435f73ab05e9a7936c301
  # The rzup components scripts/bootstrap.sh installs (r0vm 3.0.5 is the prover); ~/.risc0 is cached under this key.
  RISC0_CACHE_KEY: risc0-cargo-risczero-3.0.5-r0vm-3.0.5-rust-1.91.1-cpp-2024.1.5
  CARGO_BUILD_JOBS: "4"
  # The sequencer runs under setsid with a pid file (no systemd user manager on hosted runners).
  CV_SEQ_RUNNER: setsid

jobs:
  real-proof:
    name: private claim with a real proof, public claim, cancel
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned LEZ commit matches scripts/pins.txt; LEZ binaries go to a cached directory
        run: |
          grep -E "^lez +[^ ]+ +[^ ]+ +$LEZ_COMMIT\$" scripts/pins.txt
          echo "CV_LEZ_BIN=$RUNNER_TEMP/lez-bin" >> "$GITHUB_ENV"
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Swap file
        env:
          SWAP_GB: ${{ inputs.swap_gb }}
        run: |
          case "$SWAP_GB" in ''|*[!0-9]*) echo "swap_gb must be a whole number" >&2; exit 2 ;; esac
          if [ "$SWAP_GB" -gt 0 ]; then
            f=/mnt/cv-swapfile; [ -d /mnt ] || f=/cv-swapfile
            sudo fallocate -l "${SWAP_GB}G" "$f"
            sudo chmod 600 "$f"
            sudo mkswap "$f"
            sudo swapon "$f"
          fi
          swapon --show
          free -m
          nproc
      - name: GNU time (peak memory of the proof)
        run: |
          [ -x /usr/bin/time ] || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends time; }
          /usr/bin/time --version
      - name: Restore LEZ binaries
        id: lezcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lez-bin
          key: lez-standalone-bin-${{ env.LEZ_COMMIT }}
      - name: RISC Zero toolchains (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.risc0
          key: ${{ env.RISC0_CACHE_KEY }}
      - name: Bootstrap (system packages, rzup, LEZ checkout, LEZ binaries when not cached)
        env:
          # rzup resolves versions through the GitHub API; the workflow token avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bootstrap.sh --with-sudo
      - name: Save LEZ binaries
        if: steps.lezcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lez-bin
          key: lez-standalone-bin-${{ env.LEZ_COMMIT }}
      - name: The sequencer and wallet binaries; drop the LEZ build dir to free disk
        run: |
          ls -l "$CV_LEZ_BIN"
          rm -rf ../vendor/lez/target
          df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> ../build/target"
          key: real-proof
      - name: Start the sequencer that verifies proofs (local-pub, RISC0_DEV_MODE unset)
        run: scripts/seq.sh pub start
      - name: The wallet reaches the sequencer
        run: scripts/seq.sh pub wallet-check
      - name: Deploy token, vesting_fees (+ Init), ata and vesting, built in the pinned image (writes deploy/ids-local-pub.toml)
        env:
          CV_GUEST_MEMORY_MB: "12000"
        run: |
          scripts/deploy_local.sh pub --build release
          cat deploy/ids-local-pub.toml
      - name: Private claim with a real proof, public claim, cancel (tools/real_proof/run.sh)
        run: tools/real_proof/run.sh "$RUNNER_TEMP/real-proof"
      - name: Sequencer log
        if: always()
        run: |
          scripts/seq.sh pub stop || true
          mkdir -p "$RUNNER_TEMP/real-proof"
          cp deploy/ids-local-pub.toml "$RUNNER_TEMP/real-proof/" 2>/dev/null || true
          # Local paths are replaced as in run.sh.
          b="$(cd .. && pwd)"
          sed -e "s#$b#<build>#g" -e "s#$HOME#~#g" ../run/local-pub.log > "$RUNNER_TEMP/real-proof/sequencer.log" || true
          tail -n 200 "$RUNNER_TEMP/real-proof/sequencer.log" || true
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/real-proof
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          s="$RUNNER_TEMP/real-proof/summary.json"
          if [ -f "$s" ]; then
            cat "$s"
            {
              echo '## Private claim with a real proof'
              echo '```json'
              jq '{repo_commit, machine, transactions, control_dev_mode_receipt: {refused: .control_dev_mode_receipt.refused},
                   private_claim: (.private_claim | del(.sampled)), public_claim, cancel: {hash: .cancel.hash, block: .cancel.block}}' "$s"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no summary.json: the run stopped before the end (see the steps above and the uploaded record)"
          fi
