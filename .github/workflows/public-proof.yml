# A private claim on the public chain (tools/real_proof/README.md, "Private claim on the public chain"): this runner
# makes the beneficiary's key, builds and proves the claim against the public read-only endpoint with RISC0_DEV_MODE
# unset, and keeps the signed, proven transaction instead of sending it; the sequencer's host submits it.
#   1. `init` makes the wallet and uploads the artifact `beneficiary` (public id and public key only) at once;
#   2. the sequencer's host creates the schedule of tools/real_proof/public-claim.env for that beneficiary
#      (tools/real_proof/public_schedule.sh);
#   3. `claim` waits for that schedule, proves the claim and uploads `public-proof-<run id>` with exported-tx.json;
#   4. the sequencer's host submits it (tools/real_proof/submit_exported.sh).
# The beneficiary's key never leaves this runner: the wallet sits outside every uploaded directory.
# Actions are pinned by commit SHA (tag in the comment).
name: public-proof

on:
  workflow_dispatch:
  push:
    branches: [public-proof]

permissions:
  contents: read

concurrency:
  group: public-proof
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RISC0_DOCKER_CONTAINER_TAG: r0.1.91.1
  # LEZ v0.4.0-rc3; must equal the lez line of scripts/pins.txt (checked below).
  LEZ_COMMIT: bafd07be0701398f9bc435f73ab05e9a7936c301
  RISC0_CACHE_KEY: risc0-cargo-risczero-3.0.5-r0vm-3.0.5-rust-1.91.1-cpp-2024.1.5
  CARGO_BUILD_JOBS: "4"

jobs:
  public-proof:
    name: private claim proved against the public endpoint, kept for submission
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned LEZ commit matches scripts/pins.txt; LEZ binaries go to a cached directory
        run: |
          grep -E "^lez +[^ ]+ +[^ ]+ +$LEZ_COMMIT\$" scripts/pins.txt
          echo "CV_LEZ_BIN=$RUNNER_TEMP/lez-bin" >> "$GITHUB_ENV"
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Swap file (a margin over the runner's 16 GiB)
        run: |
          sudo fallocate -l 8G /mnt/cv-swapfile && sudo chmod 600 /mnt/cv-swapfile
          sudo mkswap /mnt/cv-swapfile && sudo swapon /mnt/cv-swapfile
          free -m
      - name: GNU time
        run: |
          [ -x /usr/bin/time ] || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends time; }
      - name: Restore LEZ binaries
        id: lezcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lez-bin
          key: lez-standalone-bin-${{ env.LEZ_COMMIT }}
      - name: RISC Zero toolchains (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.risc0
          key: ${{ env.RISC0_CACHE_KEY }}
      - name: Bootstrap (system packages, rzup, LEZ checkout, LEZ binaries when not cached)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bootstrap.sh --with-sudo
      - name: Drop the LEZ build dir to free disk
        run: rm -rf ../vendor/lez/target && df -h /
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> ../build/target"
          key: public-proof
      - name: Build the CLI
        run: source scripts/env.sh && RISC0_SKIP_BUILD=1 cargo build --locked -q -p vesting_cli
      - name: The public endpoint answers
        run: |
          set -a; source tools/real_proof/public-claim.env; set +a
          curl -fsS -m 20 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getLastBlockId","params":[]}' "$CV_PUBLIC_URL"
      - name: init (beneficiary wallet; only the public id and public key are uploaded)
        run: tools/real_proof/public_export.sh init "$RUNNER_TEMP/public-proof"
      - name: Upload the beneficiary's public id and key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beneficiary
          path: |
            ${{ runner.temp }}/public-proof/beneficiary.txt
            ${{ runner.temp }}/public-proof/beneficiary-pk.txt
          retention-days: 30
      - name: claim (waits for the schedule, proves with RISC0_DEV_MODE unset, keeps the transaction)
        run: tools/real_proof/public_export.sh claim "$RUNNER_TEMP/public-proof"
      - name: Upload the record (exported-tx.json and what made it)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/public-proof
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          s="$RUNNER_TEMP/public-proof/export-summary.json"
          if [ -f "$s" ]; then cat "$s"; else echo "no export-summary.json (see the steps above)"; fi
          [ -f "$RUNNER_TEMP/public-proof/proxy/methods.tsv" ] && cut -f2,3 "$RUNNER_TEMP/public-proof/proxy/methods.tsv" | sort | uniq -c || true
