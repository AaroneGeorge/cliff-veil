[package]
name = "cliff_veil_miniapp"
description = "View models and claim flow of the cliff-veil Basecamp mini-app: no Qt, no Nix, plain unit tests"
version = "0.1.0"
# Built by the module builder's nixpkgs rustc (1.89) as part of the core module, and by the repo toolchain for tests.
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AaroneGeorge/cliff-veil"
publish = false

# Standalone (outside the repo workspace and the core module crate's): tested with
# `cargo test --manifest-path miniapp/rust-lib/logic/Cargo.toml`; the core module's Nix build compiles it as a
# path dependency.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
